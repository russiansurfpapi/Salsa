<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salsa — Learn</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1e293b; --muted:#64748b;
    --accent:#e11d48; --accent-dim:rgba(225,29,72,0.08);
    --ok:#059669; --ok-dim:rgba(5,150,105,0.08);
    --panel:#f8fafc; --panel-2:#f1f5f9; --border:#e2e8f0;
    --gold:#d97706; --blue:#2563eb;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); min-height:100vh; }
  body { font: 17px/1.6 -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }

  nav.top {
    position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:24px;
    padding:12px 40px; background:rgba(255,255,255,0.95); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border); font-size:15px;
  }
  nav.top .brand { font-weight:700; color:var(--accent); font-size:18px; }
  nav.top a { color:var(--muted); } nav.top a.active { color:var(--fg); }
  nav.top .spacer { flex:1; }

  main { max-width:840px; margin:0 auto; padding:40px 24px 100px; }

  h1 { font-size:32px; font-weight:400; letter-spacing:-0.02em; margin:0 0 6px; }
  h1 em { color:var(--accent); font-style:normal; }
  .subtitle { color:var(--muted); font-size:15px; margin:0 0 32px; }

  .section-label {
    font-size:13px; text-transform:uppercase; letter-spacing:0.12em;
    color:var(--accent); font-weight:600; margin:32px 0 12px;
    padding-bottom:6px; border-bottom:1px solid var(--border);
  }

  .practice-card {
    border:2px solid var(--accent); border-radius:12px; background:var(--panel);
    overflow:hidden; margin-bottom:24px;
  }
  .practice-card-header {
    padding:16px 20px; background:var(--accent-dim);
    display:flex; align-items:center; gap:12px;
  }
  .practice-card-header .day-badge {
    background:var(--accent); color:#fff; font-weight:700; font-size:14px;
    padding:4px 12px; border-radius:20px;
  }
  .practice-card-header .title { font-weight:600; font-size:17px; }
  .practice-card-body { padding:16px 20px; }
  .practice-card-body .actions { margin-top:16px; display:flex; gap:8px; }
  .btn { padding:8px 20px; border:none; border-radius:6px; font:600 14px/1 inherit; cursor:pointer; }
  .btn-accent { background:var(--accent); color:#fff; } .btn-accent:hover { filter:brightness(1.1); }
  .btn-outline { background:transparent; color:var(--fg); border:1px solid var(--border); }
  .btn-outline:hover { background:var(--panel-2); }
  .btn-ok { background:var(--ok); color:#fff; font-weight:700; } .btn-ok:hover { filter:brightness(1.1); }

  .drill-section { margin-bottom:14px; }
  .drill-section .drill-heading { font-weight:700; font-size:15px; color:var(--accent); margin-bottom:4px; }
  .drill-section ul { margin:0; padding-left:20px; }
  .drill-section li { margin-bottom:4px; font-size:15px; line-height:1.6; color:var(--fg); }
  .drill-section p { margin:0 0 4px; font-size:15px; line-height:1.6; }

  .tech-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:10px; }
  .tech-card {
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:14px 16px; cursor:pointer; transition:border-color 0.15s;
  }
  .tech-card:hover { border-color:var(--accent); }
  .tech-card .tc-name { font-weight:600; font-size:15px; margin-bottom:4px; }
  .tech-card .tc-cat { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
  .tech-card.learned { border-left:3px solid var(--ok); }
  .tech-card.has-content .tc-name { color:var(--accent); }
  .tech-card .tc-badge { font-size:12px; padding:3px 8px; border-radius:8px; font-weight:600; }
  .tc-badge.done { background:var(--ok-dim); color:var(--ok); }
  .tc-badge.ready { background:var(--accent-dim); color:var(--accent); }

  .progress-row { display:flex; gap:4px; margin-bottom:24px; }
  .progress-dot {
    flex:1; height:6px; border-radius:3px; background:var(--border);
  }
  .progress-dot.done { background:var(--ok); }
  .progress-dot.current { background:var(--accent); }
</style>
</head>
<body>

<nav class="top">
  <span class="brand">salsa.</span>
  <a href="/" class="active">Home</a>
  <a href="/practice">Practice</a>
  <a href="/quiz">Quiz</a> <a href="/notes">Notes</a> <a href="/classes">Classes</a> <a href="/progress">Progress</a>
  <span class="spacer"></span>
</nav>

<main>
  <div id="app"><p style="color:var(--muted)">Loading...</p></div>
</main>

<script>
async function load() {
  const [techRes, progRes, skillsRes] = await Promise.all([
    fetch('/api/techniques'), fetch('/api/progression'),
    fetch('/api/skills').catch(() => null),
  ]);
  const techniques = await techRes.json();
  const prog = await progRes.json();
  const skills = skillsRes && skillsRes.ok ? await skillsRes.json() : null;
  render(techniques, prog, skills);
}

function formatDrill(text) {
  if (!text) return '';
  const sections = text.split(/\n\n+/);
  let html = '';
  for (const section of sections) {
    const lines = section.split('\n').filter(l => l.trim());
    if (!lines.length) continue;
    html += '<div class="drill-section">';
    let i = 0;
    if (lines[0].match(/^[A-Z].*:$/)) {
      html += `<div class="drill-heading">${esc(lines[0].replace(/:$/, ''))}</div>`;
      i = 1;
    }
    const bullets = [];
    const plain = [];
    for (; i < lines.length; i++) {
      const line = lines[i].trim();
      if (line.startsWith('- ')) {
        bullets.push(line.slice(2));
      } else if (/^\d+\.\s/.test(line)) {
        bullets.push(line.replace(/^\d+\.\s*/, ''));
      } else {
        plain.push(line);
      }
    }
    if (plain.length) {
      for (const p of plain) html += `<p>${esc(p)}</p>`;
    }
    if (bullets.length) {
      html += '<ul>';
      for (const b of bullets) html += `<li>${esc(b)}</li>`;
      html += '</ul>';
    }
    html += '</div>';
  }
  return html;
}

function render(techniques, prog, skills) {
  let html = '';
  html += `<h1><em>Salsa</em> On2</h1>`;
  html += `<p class="subtitle">NY style mambo — ${techniques.techniques?.length || 0} techniques to learn</p>`;

  const phase = prog.phases?.[prog.current_phase];
  if (phase) {
    const nextSession = phase.practice_sessions?.find(s => !s.completed);
    const completedCount = phase.practice_sessions?.filter(s => s.completed).length || 0;
    const totalSessions = phase.practice_sessions?.length || 0;

    html += `<div class="section-label">Phase ${prog.current_phase + 1}: ${esc(phase.name)}</div>`;
    html += `<p style="color:var(--muted);font-size:15px;margin:0 0 12px">${esc(phase.why)}</p>`;

    html += '<div class="progress-row">';
    for (let i = 0; i < totalSessions; i++) {
      const s = phase.practice_sessions[i];
      const cls = s.completed ? 'done' : i === completedCount ? 'current' : '';
      html += `<div class="progress-dot ${cls}"></div>`;
    }
    html += '</div>';

    if (nextSession) {
      html += `<div class="practice-card">
        <div class="practice-card-header">
          <span class="day-badge">Day ${completedCount + 1}</span>
          <span class="title">${esc(nextSession.focus)}</span>
        </div>
        <div class="practice-card-body">
          ${formatDrill(nextSession.drill)}
          <div class="actions">
            <button class="btn btn-accent" onclick="location.href='/technique/${esc(nextSession.video_focus)}'">Watch videos</button>
            <button class="btn btn-outline" onclick="location.href='/quiz?t=${esc(nextSession.video_focus)}'">Quiz me</button>
            <button class="btn btn-ok" onclick="markDone(${prog.current_phase}, ${completedCount})">Done for today</button>
          </div>
        </div>
      </div>`;
    }
  }

  if (skills && skills.techniques) {
    const techNames = {basic_step:'Basic Step',right_turn:'Right Turn',inside_turn:'Inside Turn',cross_body_lead:'Cross Body Lead',suzy_q:'Suzy Q',prep_step:'Prep Step'};
    const hasRatings = Object.values(skills.techniques).some(t => t.avg_rating > 0);
    if (hasRatings) {
      html += '<div class="section-label">Skill progress</div>';
      for (const [slug, tech] of Object.entries(skills.techniques)) {
        if (tech.avg_rating === 0) continue;
        const avg = tech.avg_rating;
        const pct = Math.round((avg / 5) * 100);
        const color = avg <= 2 ? 'var(--accent)' : avg <= 3 ? '#d97706' : 'var(--ok)';
        const weak = (tech.sub_skills || []).filter(s => s.rating > 0 && s.rating <= 2).length;
        html += `<a href="/technique/${esc(slug)}" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px;padding:6px 0">`;
        html += `<span style="min-width:130px;font-size:14px;font-weight:600">${esc(techNames[slug]||slug)}</span>`;
        html += `<div style="flex:1;height:8px;background:var(--border);border-radius:4px"><div style="height:100%;width:${pct}%;background:${color};border-radius:4px"></div></div>`;
        html += `<span style="font-size:13px;font-weight:600;color:${color};min-width:32px;text-align:right">${avg}/5</span>`;
        if (weak > 0) html += `<span style="font-size:11px;background:var(--accent-dim);color:var(--accent);padding:2px 8px;border-radius:10px;font-weight:600">${weak} weak</span>`;
        html += '</a>';
      }
      html += `<a href="/progress" style="display:inline-block;margin-top:8px;font-size:14px;font-weight:600">View full progress &rarr;</a>`;
    }
  }

  html += '<div class="section-label">Level 1 — Beginner</div>';
  html += '<div class="tech-grid">';
  for (const t of (techniques.techniques || [])) {
    const cls = [t.learned ? 'learned' : '', t.has_content ? 'has-content' : ''].join(' ');
    const badge = t.learned ? '<span class="tc-badge done">learned</span>' :
                  t.has_content ? '<span class="tc-badge ready">ready</span>' : '';
    const href = t.has_content ? `/technique/${t.slug}` : '#';
    html += `<a href="${href}" style="text-decoration:none"><div class="tech-card ${cls}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="tc-name">${t.id}. ${esc(t.name)}</span>${badge}
      </div>
      <div class="tc-cat">${esc(t.category.replace(/_/g, ' '))}</div>
    </div></a>`;
  }
  html += '</div>';

  document.getElementById('app').innerHTML = html;
}

async function markDone(phase, session) {
  const notes = prompt('Quick notes from this practice (or leave empty):') || '';
  await fetch('/api/progression/complete', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ phase, session, notes })
  });
  load();
}

function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
load();
</script>
</body>
</html>
